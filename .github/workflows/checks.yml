name: Project checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bash setup and tests
        if: runner.os == 'Linux'
        run: |
          bash scripts/dev.sh setup
          bash scripts/dev.sh test
      - name: PowerShell setup and tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/dev.ps1 -Action setup
          ./scripts/dev.ps1 -Action test
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build image
        env:
          POSTGRES_PASSWORD: ci-local-only
        run: |
          docker compose config --quiet
          docker build -t fightpredictor:ci .
      - name: Check container liveness without a database
        run: |
          docker run -d --name fight-ci -p 127.0.0.1:8000:8000 fightpredictor:ci
          trap 'docker logs fight-ci; docker rm -f fight-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          exit 1
